# Which stores each area manager looks after. Not given by the playbook or the data pack, so this is
# ASSUMED: the pack has no store addresses or distances. The stores are grouped by the approximate
# map position of their locality (straight-line, from public maps), so each manager's stores are near
# each other. Replace the positions with real store addresses and regroup if the owner wants.
# Every store belongs to exactly one area. An area manager with no area sees all stores.
areas:
  south_central:
    name: South and central
    stores: [S01, S02, S03, S04, S07, D02]
  north:
    name: North
    stores: [S06, S08, D03]
  east:
    name: East
    stores: [S05, D01, D04]

# Approximate locality positions used for the grouping (latitude, longitude). For reference only;
# nothing reads this block.
approx_positions:
