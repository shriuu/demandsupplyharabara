# Modelling assumptions. These are NOT from the playbook: each is an assumption, tuned (if at
# all) on training data only, never on the holdout. See docs/hidden_demand.md.
version: 0.1.0-draft

hidden_demand:
  # Share of a day's demand sold by hour h is taken as ((h - open) / (close - open)) ** gamma.
  # The data has no hourly sales, so the real shape cannot be observed. 1.0 means an even pace.
  # docs/hidden_demand.md shows how wrong the estimate is if the true shape differs.
  intraday_profile_gamma: 1.0
  # Safety bound so a very early sell-out cannot produce an extreme estimate.
  min_fraction_of_day: 0.1

projection:
  # Which stock shoppers take first. The brief (s2) says shoppers pick the freshest and leave
  # older stock behind, so the default is freshest first. "oldest_first" is a display-rule view.
  sales_order: freshest_first

shelf_life:
  # Boosted trees, one model per quantile, on the QC measures taken at receipt.
  # Weather is not a feature: ambient weather added nothing in the QC samples (docs/shelf_life.md).
  quantiles: [0.1, 0.5, 0.9]
  # Chosen on validation samples inside the training period (300 iterations under-fitted).
  iterations: 1500
  depth: 4
  learning_rate: 0.05
  seed: 0
  # Model development uses QC samples up to this date for fitting and the rest of the training
  # period for validation. QC samples dated in the holdout are not touched until the final run.
  fit_until: 2026-05-31
  training_period_end: 2026-08-05
