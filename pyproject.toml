[project]
name = "harabhara"
version = "0.1.0"
description = "HaraBhara Fresh demand and supply decision-support tool (PS-10)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-cloud-firestore>=2.19",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tzdata>=2026.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]
# Exploration only (scripts/); the pipeline's own data stack is added in Phase 3.
explore = [
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harabhara"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Field names mirror the YAML keys, which follow the playbook ("A", "Store", "Dark store")
"harabhara/settings/schema.py" = ["N815"]
# Report scripts print long formatted lines
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["harabhara", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["harabhara"]
branch = true

[tool.coverage.report]
show_missing = true
