# Rule -> config -> code -> test. Checked by tests/test_traceability.py.
# status: planned (nothing built) -> implemented (code exists) -> verified (test passes in CI).
# A row may only leave "planned" when its enforced_by module and test file exist.
version: 0.1.0

items:
  # ---- Guardrails (CLAUDE.md section 5) -----------------------------------------------------
  - {id: G01, kind: guardrail, source: "CLAUDE.md s5.1", statement: "A person approves every order, discount and transfer; every edit and reason is recorded; the system never acts alone", config_keys: [rules.ordering.approval_required, rules.automation.auto_order_allowed], enforced_by: harabhara/workflow/approvals.py, test: tests/backend/test_approvals.py, status: implemented}
  - {id: G02, kind: guardrail, source: "CLAUDE.md s5.2", statement: "Never recommend paying a farmer group below its contract floor, or time purchases to push risk onto them", config_keys: [rules.farmers.never_below_floor, rules.farmers.floor_prices_source], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_farmer_floor.py, status: implemented}
  - {id: G03, kind: guardrail, source: "CLAUDE.md s5.3", statement: "Never reduce a confirmed farmer-group volume; trim spot buying first, as a suggestion only", config_keys: [rules.farmers.never_cancel_confirmed_volume, rules.farmers.trim_order_when_long], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_confirmed_volume.py, status: implemented}
  - {id: G04, kind: guardrail, source: "CLAUDE.md s5.4", statement: "Waste is never reported without empty shelves and farmer share beside it", config_keys: [metrics.farmer_share], enforced_by: harabhara/sim/scorecard.py, test: tests/model/test_scorecard_reports_together.py, status: implemented}
  - {id: G05, kind: guardrail, source: "CLAUDE.md s5.5", statement: "Never route grade C produce to full-price shelves", config_keys: [rules.grading.full_price_grades, rules.surplus.grade_c_channels], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_grade_c.py, status: implemented}
  - {id: G06, kind: guardrail, source: "CLAUDE.md s5.6", statement: "Never suggest selling past the last sellable day; the rule wins over the model, and both are shown", config_keys: [rules.shelf_life.model_may_exceed_rule], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_last_sellable_day.py, status: implemented}
  - {id: G07, kind: guardrail, source: "CLAUDE.md s5.7", statement: "Discount, transfer and surplus limits from the playbook always hold", config_keys: [rules.markdown.step_1_pct, rules.transfer.max_distance_km, rules.surplus.channel_order], enforced_by: harabhara/rules/engine.py, test: tests/rules/test_playbook_limits.py, status: implemented}
  - {id: G08, kind: guardrail, source: "CLAUDE.md s5.8", statement: "Respect cold-room storage rules; a recall or safety flag removes the lot from sellable stock immediately", config_keys: [rules.receiving.no_cold_room_skus_source], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_storage_and_recall.py, status: implemented}
  - {id: G09, kind: guardrail, source: "CLAUDE.md s5.9", statement: "Every suggestion carries a one-sentence reason; no reason, no suggestion", enforced_by: harabhara/reasons/writer.py, test: tests/rules/test_reason_required.py, status: implemented}
  - {id: G10, kind: guardrail, source: "CLAUDE.md s5.10", statement: "Forecasts carry a range and flag thin history (new season, new store, missing weather or price)", enforced_by: harabhara/models/cold_start.py, test: tests/model/test_cold_start.py, status: implemented}
  - {id: G11, kind: guardrail, source: "CLAUDE.md s5.11", statement: "Public data is cited and its terms respected; a price is never invented", config_keys: [feeds.mandi.stale_after_hours, feeds.mandi.drop_after_hours], enforced_by: harabhara/data/external.py, test: tests/data/test_no_invented_prices.py, status: verified}
  - {id: G12, kind: guardrail, source: "CLAUDE.md s5.12", statement: "On any failure, show less, mark it stale, and let the manager's usual process carry on", enforced_by: harabhara/workflow/fallback.py, test: tests/backend/test_failure_fallbacks.py, status: implemented}

  # ---- Playbook rules (operations playbook v1.4) --------------------------------------------
  - {id: PB01, kind: playbook, source: "playbook s2", statement: "Orders are placed in the evening ordering window", config_keys: [schedule.evening_order_window.start, schedule.evening_order_window.end], enforced_by: harabhara/decisions/builder.py, test: tests/model/test_builder.py, status: implemented}
  - {id: PB02, kind: playbook, source: "playbook s3", statement: "Grade C is not for display; it goes to B2B buyers or processing", config_keys: [rules.grading.C], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_grade_c.py, status: implemented}
  - {id: PB03, kind: playbook, source: "playbook s3", statement: "Produce arriving warmer than the limit loses shelf-life days", config_keys: [rules.receiving.hot_arrival_temp_c, rules.receiving.hot_arrival_life_penalty_days], enforced_by: harabhara/models/shelf_life.py, test: tests/model/test_shelf_life.py, status: implemented}
  - {id: PB04, kind: playbook, source: "playbook s3", statement: "Chilling-injury products never go in the cold room", config_keys: [rules.receiving.no_cold_room_skus_source, rules.receiving.chilling_injury_below_c], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_storage_and_recall.py, status: planned}
  - {id: PB05, kind: playbook, source: "playbook s3", statement: "Leafy greens are never stacked above the crate limit", config_keys: [rules.receiving.leafy_greens_max_crate_stack], enforced_by: harabhara/rules/engine.py, test: tests/rules/test_playbook_limits.py, status: planned}
  - {id: PB06, kind: playbook, source: "playbook s4", statement: "Shelf life is counted from the day produce reaches the store", config_keys: [rules.shelf_life.count_starts], enforced_by: harabhara/state/stock_ledger.py, test: tests/data/test_ledger_age.py, status: planned}
  - {id: PB07, kind: playbook, source: "playbook s5", statement: "Last sellable day: first markdown step from opening", config_keys: [rules.markdown.step_1_pct, rules.markdown.step_1_when], enforced_by: harabhara/decisions/discount.py, test: tests/rules/test_markdown_steps.py, status: implemented}
  - {id: PB08, kind: playbook, source: "playbook s5", statement: "Second markdown step only after the cut-off hour and only for leafy greens and bananas", config_keys: [rules.markdown.step_2_pct, rules.markdown.step_2_after_hour, rules.markdown.step_2_categories_or_skus], enforced_by: harabhara/decisions/discount.py, test: tests/rules/test_markdown_steps.py, status: implemented}
  - {id: PB09, kind: playbook, source: "playbook s5", statement: "Never mark down below purchase cost before the second-step hour", config_keys: [rules.markdown.floor_basis_before_step_2], enforced_by: harabhara/decisions/discount.py, test: tests/rules/test_markdown_floor.py, status: implemented}
  - {id: PB10, kind: playbook, source: "playbook s5", statement: "Area manager approves a markdown on more than the set share of a day's delivery", config_keys: [rules.markdown.area_manager_approval_if_share_of_days_delivery_above, rules.markdown.approver_default], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_playbook_limits.py, status: implemented}
  - {id: PB11, kind: playbook, source: "playbook s6", statement: "Transfers stay within the distance limit and arrive before the van cut-off", config_keys: [rules.transfer.max_distance_km, rules.transfer.must_arrive_before_hour], enforced_by: harabhara/decisions/transfer.py, test: tests/rules/test_transfer_limits.py, status: planned}
  - {id: PB12, kind: playbook, source: "playbook s6", statement: "A van trip costs a set amount; small low-value transfers are not worth it", config_keys: [rules.transfer.van_cost_inr, rules.transfer.min_units_low_value, rules.transfer.low_value_threshold_inr], enforced_by: harabhara/decisions/transfer.py, test: tests/rules/test_transfer_limits.py, status: implemented}
  - {id: PB13, kind: playbook, source: "playbook s6", statement: "Leafy greens are not transferred after the noon cut-off", config_keys: [rules.transfer.leafy_greens_no_transfer_after_hour], enforced_by: harabhara/decisions/transfer.py, test: tests/rules/test_transfer_limits.py, status: implemented}
  - {id: PB14, kind: playbook, source: "playbook s13", statement: "Area manager approves transfers by the approval hour", config_keys: [rules.transfer.approver, rules.transfer.approve_by_hour], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_playbook_limits.py, status: implemented}
  - {id: PB15, kind: playbook, source: "playbook s7", statement: "Surplus goes to paying B2B buyers, then food banks, then animal feed or compost; nothing edible to landfill", config_keys: [rules.surplus.channel_order, rules.surplus.landfill_edible_allowed], enforced_by: harabhara/decisions/surplus.py, test: tests/rules/test_surplus_channels.py, status: implemented}
  - {id: PB16, kind: playbook, source: "playbook s7", statement: "Surplus is matched only where the buyer's notice period, pickup window, grades and capacity fit", config_keys: [rules.surplus.notice_hours_source], enforced_by: harabhara/decisions/surplus.py, test: tests/rules/test_surplus_matching.py, status: implemented}
  - {id: PB17, kind: playbook, source: "playbook s13", statement: "Store manager confirms the pickup plan by the confirmation hour", config_keys: [rules.surplus.store_confirms_plan_by_hour], enforced_by: harabhara/decisions/builder.py, test: tests/model/test_builder.py, status: implemented}
  - {id: PB18, kind: playbook, source: "playbook s8", statement: "Farmer groups are paid within the payment terms", config_keys: [rules.farmers.payment_terms_days], enforced_by: harabhara/rules/guardrails.py, test: tests/rules/test_farmer_floor.py, status: planned}
  - {id: PB19, kind: playbook, source: "playbook s8", statement: "A three-day volume forecast is shared with each farmer group, as information only", config_keys: [rules.farmers.share_forecast_horizon_days], enforced_by: harabhara/pipeline/run.py, test: tests/model/test_pipeline.py, status: implemented}
  - {id: PB20, kind: playbook, source: "playbook s10", statement: "Automatic ordering only after beating managers for the pilot period; otherwise a person approves", config_keys: [rules.automation.auto_order_allowed, rules.automation.pilot_weeks_before_auto], enforced_by: harabhara/workflow/approvals.py, test: tests/backend/test_approvals.py, status: implemented}

  # ---- Acceptance scenarios (brief section 6) -----------------------------------------------
  - {id: T01, kind: acceptance, source: "brief s6 T1", statement: "Forecast every in-season store-product for the 56 holdout days; report WAPE and bias overall and by category; beat the managers' rule", config_keys: [metrics.holdout.days], enforced_by: harabhara/models/demand.py, test: tests/scenarios/test_final_results.py, status: verified}
  - {id: T02, kind: acceptance, source: "brief s6 T2", statement: "Coriander at a walk-in store on a normal Tuesday: order near expected demand, smaller buffer, cites two-day shelf life", enforced_by: harabhara/decisions/order.py, test: tests/scenarios/test_t02_coriander.py, status: implemented}
  - {id: T03, kind: acceptance, source: "brief s6 T3", statement: "Day before Ganesha Chaturthi: bananas and coconuts up sharply, onions almost unchanged", enforced_by: harabhara/models/demand.py, test: tests/scenarios/test_final_results.py, status: verified}
  - {id: T04, kind: acceptance, source: "brief s6 T4", statement: "Heavy rain forecast: lower for walk-in stores, higher for dark stores, said in the reason", enforced_by: harabhara/models/demand.py, test: tests/scenarios/test_t04_heavy_rain.py, status: implemented}
  - {id: T05, kind: acceptance, source: "brief s6 T5", statement: "Tomato mandi price doubles in a week: lower demand expected, order adjusted, price flagged to the buying lead", enforced_by: harabhara/features/price.py, test: tests/scenarios/test_t05_price_shock.py, status: planned}
  - {id: T06, kind: acceptance, source: "brief s6 T6", statement: "A product sold out at 2 pm yesterday: unmet demand is estimated, not treated as full demand", enforced_by: harabhara/features/hidden_demand.py, test: tests/model/test_hidden_demand.py, status: implemented}
  - {id: T07, kind: acceptance, source: "brief s6 T7", statement: "One store holds twice its expected beans demand while a nearby store runs out: suggest a transfer with quantity, timing before 11 am and van cost", config_keys: [rules.transfer.must_arrive_before_hour, rules.transfer.van_cost_inr], enforced_by: harabhara/decisions/transfer.py, test: tests/scenarios/test_t07_transfer.py, status: implemented}
  - {id: T08, kind: acceptance, source: "brief s6 T8", statement: "Sixty kg of grade-B tomato surplus: pickup plan with suitable buyers inside notice and pickup windows, with expected rupee recovery", enforced_by: harabhara/decisions/surplus.py, test: tests/scenarios/test_t08_surplus_plan.py, status: implemented}
  - {id: T09, kind: acceptance, source: "brief s6 T9", statement: "QC sample (tomato, two days since harvest, 31 C, firmness 5.8): estimated sellable days below the fixed rule, with why", config_keys: [rules.receiving.hot_arrival_temp_c], enforced_by: harabhara/models/shelf_life.py, test: tests/scenarios/test_t09_shelf_life.py, status: implemented}
  - {id: T10, kind: acceptance, source: "brief s6 T10", statement: "Replay the holdout with our orders: waste, stock-outs and margin by store and category, with no change to prices paid to FPOs", enforced_by: harabhara/sim/replay.py, test: tests/scenarios/test_final_results.py, status: verified}
